<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gate · portal test</title>
<style>html,body{margin:0;height:100%;background:#05070e;overflow:hidden;font-family:system-ui,sans-serif;color:#dfe9ff}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#ui{z-index:5;position:fixed;left:0;right:0;bottom:0;padding:26px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;background:linear-gradient(0deg,rgba(5,7,14,.92) 60%,transparent)}
.row{display:flex;gap:6px;align-items:center}.row b{font:700 10px system-ui;letter-spacing:.14em;text-transform:uppercase;opacity:.55;width:58px;flex:none}
button{touch-action:manipulation;padding:9px 6px;border:2px solid #0d1220;background:#222c46;color:#cfe0ff;font:700 12px system-ui;letter-spacing:.04em;border-radius:3px;flex:1}
button.on{background:#ffd23f;color:#0d1220}
.dots button{flex:none;width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #0d1220;opacity:.75}.dots button.on{opacity:1;outline:3px solid #fff}
input[type=range]{flex:1;accent-color:#5ad0ff;min-width:0}
small{z-index:5;position:fixed;top:12px;left:0;right:0;text-align:center;opacity:.55;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.embed #ui,.embed small{display:none!important}
#peekcap{position:fixed;left:12px;right:12px;bottom:22px;z-index:5;text-align:center;font:700 17px/1.3 system-ui,sans-serif;color:#fff;text-shadow:0 2px 6px #000,0 0 3px #000;opacity:0;transition:opacity .4s;pointer-events:none}#peekcap.on{opacity:1}
#peekalert{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(190,20,20,.85) 100%)}
#peekeye{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:6;font:700 12px/1 system-ui,sans-serif;letter-spacing:.2em;padding:5px 10px;border:2px solid #000;background:#2a3a44;color:#9fb7c6;pointer-events:none}#peekeye:empty{display:none}#peekeye.s{background:#c92b2b;color:#fff}#peekeye.e{background:#d6b24a;color:#111}
#peekv{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 46%,transparent 38%,rgba(2,3,10,.55) 72%,rgba(2,3,10,.92) 100%)}
</style>
<small>drag to look around the gate</small>
<div id=peekv></div><div id=ui>
<div class=row><b>Location</b><button data-loc=woods>Woods</button><button data-loc=city>City</button><button data-loc=wall>Stone wall</button></div>
<div class=row><b>Beyond</b><button data-bey=woods>Woods</button><button data-bey=city>City</button><button data-bey=wall>Wall</button></div>
<div class="row dots"><b>Colour</b><button data-col=cyan></button><button data-col=violet></button><button data-col=gold></button><button data-col=green></button><button data-col=red></button></div>
<div class=row><b>Charge</b><input id=ch type=range min=0 max=1 step=.01 value=0><button id=go style="flex:none;padding:9px 12px">▶ Charge</button></div>
<div class=row><b>Reveal</b><input id=rv type=range min=0 max=1 step=.01 value=0><button id=open style="flex:none;padding:9px 12px">▶ Open</button></div>
</div>
<script src="gate.js?v=20"></script>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kip's landing pad</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b1424;color:#f4ead2;font-family:system-ui,sans-serif}canvas{display:block;position:absolute;inset:0;touch-action:none}#labels{position:absolute;inset:0;pointer-events:none}.drop{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;min-width:48px;min-height:42px;padding:5px 10px;border:3px solid #05070e;border-bottom-width:5px;background:#ffd23f;color:#0d1220;font:900 24px/1 system-ui;box-shadow:3px 3px #0008;border-radius:4px}.drop:nth-child(2){background:#65eeda}.drop:nth-child(3){background:#c2b1ff}.drop[hidden]{display:none}#drag{position:absolute;bottom:8px;left:0;right:0;text-align:center;pointer-events:none;font-size:19px;color:#b9def0;opacity:.6}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#0b1424;font-size:28px;letter-spacing:.3em}#loading[hidden],#fallback[hidden],#drag[hidden]{display:none}#fallback{position:absolute;inset:0;display:flex;gap:20px;align-items:center;justify-content:center}#fallback button{position:static;transform:none}
</style></head><body><div id="labels"></div><div id="drag" aria-hidden="true">↔</div><div id="loading" role="status" aria-label="Loading 3D cargo">•••</div><div id="fallback" hidden><button class="drop" onclick="parent.postMessage({airdrop:{choose:10}},location.origin)">10</button><button class="drop" onclick="parent.postMessage({airdrop:{choose:30}},location.origin)">30</button><button class="drop" onclick="parent.postMessage({airdrop:{choose:60}},location.origin)">60</button></div><script src="scene.js?v=1"></script></body></html>

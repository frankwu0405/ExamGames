<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1220">
<title>The Gate 8: The Empty Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1220;--ink2:#171f36;--paper:#f4ead2;--yellow:#ffd23f;--orange:#ff7a1a;--teal:#2de3d0;--red:#ff3b4e;--good:#7dff8a;--sh:42dvh;
--hd:'Bangers','Impact','Arial Black',sans-serif;--bd:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05070d;color:var(--paper);font-family:var(--bd);overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--ink)}
#stage{position:relative;height:var(--sh);flex:none;overflow:hidden;background:#04060c;transition:height .45s cubic-bezier(.6,.05,.2,1);touch-action:none}
#world{position:absolute;left:0;top:0;width:2576px;height:1438px;transform-origin:0 0;will-change:transform,clip-path}
.pg{position:absolute;left:0;top:0;width:2576px;height:1438px;opacity:0;transition:opacity .4s;max-width:none;user-select:none;-webkit-user-drag:none}
#bezel{position:absolute;pointer-events:none;box-shadow:0 0 0 3px #000,0 0 0 5px var(--paper)}
#stat{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;mix-blend-mode:screen;opacity:0;pointer-events:none}
#curtain{position:absolute;inset:0;background:repeating-linear-gradient(135deg,#0a0e1a 0 14px,#0d1220 14px 28px);display:flex;align-items:center;justify-content:center;font:900 90px var(--hd);color:#243052;transition:clip-path .9s cubic-bezier(.6,.05,.2,1);clip-path:inset(0 0 0 0);z-index:4}
#curtain.up{clip-path:inset(0 0 100% 0);pointer-events:none}
#cap{position:absolute;left:10px;top:10px;z-index:6;font:400 21px var(--hd);letter-spacing:.06em;color:var(--ink);background:var(--yellow);padding:3px 14px 3px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);box-shadow:3px 3px 0 #000}
#hud{position:absolute;right:8px;top:8px;z-index:6;display:flex;gap:6px}
#hud button{width:38px;height:38px;border:2px solid #000;background:rgba(244,234,210,.92);color:var(--ink);padding:0;display:flex;align-items:center;justify-content:center;transform:rotate(-2deg);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
#hud button:nth-child(2){transform:rotate(2deg);opacity:.55}
#hud svg{width:22px;height:22px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden}
.pop{position:absolute;left:50%;top:44%;font:400 64px var(--hd);color:var(--yellow);-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #000;letter-spacing:.04em;animation:pop .95s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(-6deg);opacity:1}100%{transform:translate(-50%,-90%) scale(1) rotate(-4deg);opacity:0}}
.spk{position:absolute;width:8px;height:8px;background:var(--yellow);animation:spk .7s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.2);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.75}100%{opacity:0}}
.flash.red{background:var(--red)}
#ret{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;z-index:5;pointer-events:none;display:none}
#ret circle{fill:none;stroke-width:5}
.pin{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:12px solid var(--yellow);box-shadow:0 0 0 6px #000;background:rgba(255,210,63,.18);animation:pin .5s ease-out}
@keyframes pin{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
#play{flex:1;min-height:0;position:relative;margin-top:-16px;padding:30px 16px 84px;background:var(--ink) radial-gradient(rgba(255,255,255,.045) 1.4px,transparent 1.6px) 0 0/11px 11px;clip-path:polygon(0 16px,100% 0,100% 100%,0 100%);display:flex;flex-direction:column;gap:12px;overflow-y:auto;z-index:2}
#play>*{flex:none}
.sm{font:700 12px var(--bd);letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.hook{font:400 40px/1 var(--hd);letter-spacing:.03em;color:var(--paper);text-shadow:3px 3px 0 #000;margin:4px 0 0}
.hook em{font-style:normal;color:var(--yellow)}
.go{align-self:stretch;margin-top:auto;font:400 28px var(--hd);letter-spacing:.04em;color:var(--ink);background:var(--yellow);border:3px solid #000;padding:12px 18px;white-space:nowrap;box-shadow:5px 5px 0 #000;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);text-align:left;cursor:pointer}
.go:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000}
.go.alt{background:var(--paper)}
.ask{font:400 24px var(--hd);letter-spacing:.06em;color:var(--ink);background:var(--yellow);align-self:flex-start;padding:2px 14px 2px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);transform:rotate(-1deg)}
.line{font:700 clamp(25px,7.4vw,34px)/1.28 var(--bd);color:var(--paper);letter-spacing:.005em;word-spacing:.04em}
.line .w{display:inline-block;padding:0 2px;border-radius:3px;transition:color .12s}
.line .w.hit{color:var(--good);animation:hit .25s}
.line .w.sub,.line .w.miss{color:#ffb061;text-decoration:underline wavy var(--orange) 2px;text-underline-offset:5px}
@keyframes hit{0%{transform:translateY(-4px) scale(1.12)}100%{transform:none}}
.line .p{color:var(--orange);text-shadow:0 0 .6em rgba(255,122,26,.35)}
.line .q{color:var(--teal)}
.line .w.hit .p,.line .w.hit .q{color:inherit;text-shadow:none}
.heard{min-height:30px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font:500 15px var(--bd)}
.heard b{font:700 11px var(--bd);letter-spacing:.14em;color:var(--teal);margin-right:3px;text-transform:uppercase}
.heard span{padding:1px 7px;border:1.5px solid #3a4770;color:#b8c3e6}
.heard span.hit{border-color:var(--good);color:var(--good)}
.heard span.sub{border-color:var(--orange);color:#ffb061}
.heard span.extra{border-style:dashed;color:#7e8bb5}
.heard i{font-style:normal;color:#7e8bb5}
.msg{min-height:22px;font:700 15px var(--bd);color:var(--yellow)}
.opts{display:flex;flex-direction:column;gap:10px}.opts.many{gap:7px}.opts.many .opt{padding:6px 10px 7px}.opts.many .opt .line{font-size:clamp(16px,4.6vw,19px)}
.opt{position:relative;background:var(--paper);color:var(--ink);border:3px solid #000;padding:9px 12px 10px;box-shadow:4px 4px 0 #000;transition:transform .25s,opacity .25s,background .2s;user-select:none;-webkit-user-select:none}
.opt:nth-child(3n+1){transform:rotate(-.9deg);margin-right:10px}.opt:nth-child(3n+2){transform:rotate(.6deg);margin-left:12px}.opt:nth-child(3n){transform:rotate(-.3deg);margin-right:4px;margin-left:5px}
.opt .line{font-size:clamp(19px,5.4vw,24px);color:var(--ink);line-height:1.22}
.opt .line .p{color:#d85600;text-shadow:none}.opt .line .q{color:#0a8f84}
.opt .line .w.hit{color:#0b8a2d}
.opt .line .w.sub,.opt .line .w.miss{color:#b34a00}
.opt.wrong{background:#3a4166;color:#8d97c4;transform:scale(.97);opacity:.55;box-shadow:none}
.opt.wrong .line{color:#98a2cf}
.opt.wrong::after{content:'NOPE';position:absolute;right:6px;top:-14px;font:400 24px var(--hd);color:#fff;background:var(--red);padding:0 8px;border:2px solid #000;transform:rotate(-6deg);letter-spacing:.08em}
.opt.right{background:#c9ffcf;animation:hit .3s}
.mic{position:absolute;right:12px;bottom:12px;z-index:3;width:54px;height:54px;border:3px solid #000;background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;box-shadow:3px 3px 0 #000;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.mic svg{width:28px;height:28px}
.mic.on{background:var(--teal)}
.mic.on::before{content:'';position:absolute;inset:-6px;border:3px solid var(--teal);animation:pulse 1.2s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.mic.bad{background:var(--red)}
.hear{align-self:flex-start;font:700 14px var(--bd);color:var(--paper);background:none;border:2px dashed #55618f;padding:6px 12px}
.hide{display:none!important}
#tray{position:absolute;left:10px;bottom:8px;z-index:3;height:70px;width:150px;pointer-events:none}
#tray img,#tray .slot{position:absolute;bottom:0;width:46px;height:68px;border:2px solid #000;object-fit:cover;pointer-events:auto;transition:transform .3s}
#tray .slot{background:#0a0e1a;border:2px dashed #3a4770;display:flex;align-items:center;justify-content:center;font:400 18px var(--hd);color:#3a4770;pointer-events:none}
.cardbig{align-self:center;width:min(58%,230px);height:auto;border:3px solid #000;box-shadow:6px 6px 0 #000;animation:flip .7s}
@keyframes flip{0%{transform:rotateY(90deg) scale(.7)}100%{transform:none}}
.cards2{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-start}
.cards2 img{width:42%;max-width:190px;border:3px solid #000;box-shadow:5px 5px 0 #000;animation:flip .7s}
.cards2 img:nth-child(2){margin-top:14px;animation-delay:.2s}
.pt{display:flex;align-items:center;gap:10px}
.pt i{display:block;width:84px;height:84px;border:3px solid #000;box-shadow:3px 3px 0 #000;background-repeat:no-repeat}
.pt span{font:400 24px var(--hd);letter-spacing:.06em;color:var(--yellow)}
.slots{display:flex;gap:8px}
.slots div{flex:1;min-height:58px;border:3px dashed #3a4770;padding:5px 8px;font:700 13px/1.2 var(--bd);color:var(--ink);display:flex;align-items:center}
.slots div.f{border:3px solid #000;background:var(--yellow);animation:hit .3s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font:400 17px var(--hd);letter-spacing:.05em;padding:1px 9px;border:2px solid #3a4770;color:#6c7aa8}
.chips span.on{background:var(--good);color:var(--ink);border-color:#000;box-shadow:2px 2px 0 #000}
.live{font:500 17px/1.35 var(--bd);color:var(--paper);min-height:48px;border-left:4px solid var(--teal);padding-left:10px}
.ord{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ord .c{position:relative;width:40%;max-width:170px;cursor:pointer;transition:transform .2s}
.ord .c img{width:100%;border:3px solid #000;box-shadow:4px 4px 0 #000;display:block}
.ord .c b{position:absolute;left:-6px;top:-8px;font:400 40px var(--hd);color:var(--yellow);-webkit-text-stroke:3px #000;paint-order:stroke fill}
.ord .c.no{animation:shake .4s}
#teacher{position:fixed;inset:0;z-index:50;background:rgba(5,7,13,.86);display:none;align-items:flex-end;justify-content:center}
#teacher.open{display:flex}
#teacher .sheet{position:relative;width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--paper);color:var(--ink);padding:16px 16px 28px;border-top:5px solid #000}
#teacher h3{font:400 28px var(--hd);letter-spacing:.06em;margin:0 0 6px}
#teacher h4{font:800 12px var(--bd);letter-spacing:.14em;text-transform:uppercase;margin:16px 0 6px;color:#37406a}
#teacher p,#teacher li{font:500 14px/1.4 var(--bd);margin:3px 0}
#teacher button{font:700 14px var(--bd);color:var(--ink);background:#fff;border:2px solid #000;padding:8px 12px;margin:3px 6px 3px 0;box-shadow:2px 2px 0 #000}
#teacher button.pri{background:var(--yellow)}
#teacher .x{position:absolute;right:12px;top:10px}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:9;background:var(--paper);color:var(--ink);font:700 14px var(--bd);padding:6px 12px;border:2px solid #000;white-space:nowrap}
#title{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 4px}
.ttl{font:400 clamp(50px,16vw,104px)/.94 var(--hd);color:var(--paper);-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:6px 6px 0 #000;font-kerning:normal;letter-spacing:.008em;white-space:nowrap;transform:rotate(-3deg);margin:0 0 8px 6px}
.ttl em{display:block;font-style:normal;color:var(--red);font-size:.57em;letter-spacing:.035em;margin-left:.22em}

.student-form{margin:0}
.student-input{display:block;width:100%;min-height:44px;border:0;border-radius:0;appearance:none;background:#fff;color:var(--ink);padding:9px 18px;font:700 16px var(--bd);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.student-input::placeholder{color:#85858e;opacity:1}
.student-input:focus-visible{outline:2px solid var(--yellow);outline-offset:-4px}
.student-greeting{color:#fff;font:700 clamp(24px,6vw,34px)/1.2 var(--bd);overflow-wrap:anywhere}
.student-name-link{display:inline;appearance:none;border:0;border-radius:0;background:none;box-shadow:none;color:inherit;font:inherit;padding:0;white-space:normal;overflow-wrap:anywhere;max-width:100%;text-align:left;text-decoration:underline dotted;text-decoration-thickness:.075em;text-underline-offset:.19em;cursor:pointer}
.student-name-link:focus-visible{outline:2px solid var(--yellow);outline-offset:4px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="world"><img class="pg" src="assets/p1.jpg" alt=""><img class="pg" src="assets/p2.jpg" alt=""><img class="pg" src="assets/p3.jpg" alt=""><img class="pg" src="assets/p4.jpg" alt=""></div>
    <div id="bezel"></div>
    <canvas id="stat" width="96" height="72"></canvas>
    <svg id="ret" viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" stroke="#000" stroke-opacity=".55"/><circle id="retp" cx="42" cy="42" r="36" stroke="#ffd23f" stroke-dasharray="226" stroke-dashoffset="226" transform="rotate(-90 42 42)"/><circle cx="42" cy="42" r="4" fill="#ffd23f" stroke="none"/></svg>
    <div id="curtain">?</div>
    <div id="cap" class="hide"></div>
    <div id="hud">
      <button id="mute" aria-label="Sound on/off"></button>
      <button id="gear" aria-label="Teacher (hold)"><svg viewBox="0 0 24 24" fill="none" stroke="#0d1220" stroke-width="2.4" stroke-linecap="square"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><path d="M16 4v6M8 14v6"/></svg></button>
    </div>
    <div id="fx"></div>
  </div>
  <main id="play" aria-live="polite"></main>
  <div id="tray"></div>
  <button id="mic" class="mic hide" aria-label="Microphone"><svg viewBox="0 0 24 24" fill="none" stroke="#0d1220" stroke-width="2.6" stroke-linecap="square"><path d="M9 3h6v10a3 3 0 0 1-6 0z"/><path d="M5 11v2a7 7 0 0 0 14 0v-2M12 20v2"/></svg></button>
</div>
<div id="teacher"><div class="sheet"><button class="x" id="tx">Close ✕</button><div id="tbody"></div></div></div>

<script>
'use strict';
/* =========================================================
   The Gate 8: The Empty Room
   Static page. Browser speech recognition + WebAudio only.
   ========================================================= */
const IW=2576, IH=1438;
const TEST=/[?&]test/.test(location.search);
const testBtn=(label,f)=>{const b=el('button','hear','TEST · '+label);b.style.cssText='border-color:#ff7a1a;color:#ffb061';b.onclick=f;return b;};
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let RUN=0;
const sleep=ms=>{const t=RUN;return new Promise((res,rej)=>setTimeout(()=>t===RUN?res():rej('cancel'),ms));};
window.addEventListener('unhandledrejection',e=>e.preventDefault());
const storage={
  get(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}},
  set(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch{}}
};
const fresh=()=>({ch:0,earned:[],stats:{},strict:false,muted:false});
const copy=value=>JSON.parse(JSON.stringify(value));
const roster=storage.get('gate8-students',{active:'',students:[]});
let student=roster.students.find(entry=>entry.id===roster.active);
const S=Object.assign(fresh(),student?.progress??(roster.students.length?{}:storage.get('gate8v2',{})));
function save(){
  if(!student){storage.set('gate8v2',S);return;}
  student.progress=copy(S);
  storage.set('gate8-students',roster);
}
function selectStudent(name){
  const id=name.toLocaleLowerCase();
  const existing=roster.students.find(entry=>entry.id===id);
  const progress=existing?.progress??(roster.students.length?fresh():S);
  student=existing??{id,name};
  if(!existing)roster.students.push(student);
  roster.active=id;
  Object.assign(S,fresh(),copy(progress));
  save();renderTray();paintMute();
}

/* ---------- comic geometry: [page, x, y, w, h] inside each real panel ---------- */
const SHOT={
 title:[0,330,52,600,636], shed:[0,72,52,1524,636], shedL:[0,72,52,900,636], shedR:[0,800,52,796,636],
 deadBug:[0,1768,52,732,568], repair:[0,72,856,1056,512], repairL:[0,72,856,760,512], tap:[0,1304,764,308,600], buzz:[0,1800,724,704,644],
 holo:[1,72,52,1280,656], man:[1,1492,52,1008,568], shoulder:[1,72,856,1052,512], map:[1,1304,760,1196,608],
 alley:[2,72,52,1272,584], creak:[2,1488,52,1008,520], shop:[2,72,724,2424,640], curlyW:[2,760,724,853,640], wall:[2,1960,724,536,640],
 draw:[3,72,52,1140,584], kipPts:[3,1344,52,1152,520], decide:[3,72,724,1348,640], tower:[3,1548,676,948,688]
};
const PANEL3=[72,724,2424,640];
const CARD={dirty:'assets/card-dirty.webp',circle:'assets/card-circle.webp',purple:'assets/card-purple.webp',curly:'assets/card-curly.webp'};
const CARDS=['dirty','circle','purple','curly'];

/* ---------- camera ---------- */
const stage=$('#stage'), world=$('#world'), pgs=[...document.querySelectorAll('.pg')], bez=$('#bezel');
let ST={W:390,H:340}, lastShot='shed', curPg=-1, panelView=null;
function measure(){ST.W=stage.clientWidth;ST.H=stage.clientHeight;}
function stageH(vh,animate=true){
  const px=Math.round(innerHeight*vh/100);
  stage.style.transition=animate?'':'none';
  stage.style.setProperty('--sh',vh+'dvh');
  ST.H=px;ST.W=stage.clientWidth||ST.W;
  if(lastShot&&!panelView)cam(lastShot,{dur:animate?450:0,keepPage:true});
}
function applyView(tx,ty,s,clip,dur){
  const tr=dur?`transform ${dur}ms cubic-bezier(.65,.02,.2,1),clip-path ${dur}ms cubic-bezier(.65,.02,.2,1)`:'none';
  world.style.transition=tr;
  world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
  world.style.clipPath=`inset(${clip[1]}px ${IW-clip[0]-clip[2]}px ${IH-clip[1]-clip[3]}px ${clip[0]}px)`;
}
function cam(key,o={}){
  const dur=o.dur==null?1100:o.dur;
  const sh=typeof key==='string'?SHOT[key]:key; if(typeof key==='string')lastShot=key;
  const [pg,x,y,w,h]=sh;
  const pad=12, s=Math.min((ST.W-pad*2)/w,(ST.H-pad*2)/h);
  const tx=(ST.W-w*s)/2-x*s, ty=(ST.H-h*s)/2-y*s;
  const swap=pg!==curPg&&!o.keepPage;
  if(swap){applyView(tx,ty,s,[x,y,w,h],0);void world.offsetWidth;pgs.forEach((p,i)=>p.style.opacity=i===pg?1:0);curPg=pg;}
  else applyView(tx,ty,s,[x,y,w,h],dur);
  bez.style.transition=swap||!dur?'none':`all ${dur}ms cubic-bezier(.65,.02,.2,1)`;
  bez.style.left=(ST.W-w*s)/2+'px';bez.style.top=(ST.H-h*s)/2+'px';bez.style.width=w*s+'px';bez.style.height=h*s+'px';
  return s;
}
function fxLayer(){return $('#fx');}
function pop(txt,color){const p=el('div','pop',txt);if(color)p.style.color=color;fxLayer().append(p);setTimeout(()=>p.remove(),1000);}
function burst(n=14,color){const L=fxLayer();for(let i=0;i<n;i++){const s=el('div','spk');s.style.left=ST.W/2+(Math.random()*60-30)+'px';s.style.top=ST.H/2+(Math.random()*40-20)+'px';s.style.setProperty('--dx',(Math.random()*260-130)+'px');s.style.setProperty('--dy',(Math.random()*200-110)+'px');if(color)s.style.background=color;L.append(s);setTimeout(()=>s.remove(),750);}}

const NUM={0:'zero',1:'one',2:'two',3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine',10:'ten'};
const norm=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(w=>NUM[w]||w);
const HOMO={};[['to','too','two'],['for','four'],['no','know'],['right','write'],['there','their','theyre'],['hear','here'],['one','won'],['new','knew'],['red','read'],['by','buy','bye'],['fur','fir'],['allowed','aloud'],['so','sew'],['would','wood'],['tale','tail'],['whirl','whirled','whirls'],['hi','high'],['night','knight'],['wow','whoa']].forEach(g=>g.forEach(w=>HOMO[w]=g));
const SOFT={finn:['fin','finn','phin','fen','finnes'],kip:['kip','keep','kit','kid','kipp','kib','cape','ship'],nara:['nara','nora','narra','narah','naira','narrow','mara','sarah'],vex:['vex','vexx','vets','becks','vecs','bex','vax','box','backs','vegas'],watcher:['watcher','watchers','washer','watch','wash'],toby:['toby','tobey']};
const FN=new Set('the a an to of in on at is it and he she we us so up his her its for'.split(' '));
const NOKEY=new Set('would could should you your young touch touches shoulder through thought enough double trouble sure pure eight wire wires fire their tire during cure'.split(' '));
function mkTok(raw){const n=norm(raw)[0]||'';const base=n.replace(/s$/,'');return{raw,n,base,soft:!!SOFT[base],fn:FN.has(n),key:/(ir|ur|igh|ou)/.test(n)&&!NOKEY.has(n)};}
function eq(t,h){if(t.n===h)return true;if(t.soft&&SOFT[t.base].includes(h.replace(/s$/,'')))return true;const g=HOMO[t.n];return!!g&&g.includes(h);}
function align(T,H){
  const n=T.length,m=H.length,D=[],B=[];
  for(let i=0;i<=n;i++){D.push(new Array(m+1).fill(0));B.push(new Array(m+1).fill(0));}
  for(let i=1;i<=n;i++){D[i][0]=i;B[i][0]=2;}
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
    const same=eq(T[i-1],H[j-1]);
    const a=D[i-1][j-1]+(same?0:1),b=D[i][j-1]+.6,c=D[i-1][j]+1;
    if(a<=b&&a<=c){D[i][j]=a;B[i][j]=same?1:3;}else if(b<=c){D[i][j]=b;B[i][j]=4;}else{D[i][j]=c;B[i][j]=2;}
  }
  let bj=0,bv=D[n][0];for(let j=1;j<=m;j++)if(D[n][j]<bv){bv=D[n][j];bj=j;}
  const t=new Array(n).fill('miss'),h=new Array(m).fill('extra');
  let i=n,j=bj;
  while(i>0){const b=B[i][j];if(b===1){t[i-1]='hit';h[j-1]='hit';i--;j--;}else if(b===3){t[i-1]='sub';h[j-1]='sub';i--;j--;}else if(b===4&&j>0){j--;}else{i--;}}
  return{t,h,hits:t.filter(x=>x==='hit').length};
}
function bestAln(T,cands){let best=null;for(const w of cands){const a=align(T,w);const sc=a.hits-.05*a.h.filter(x=>x==='extra').length;if(!best||sc>best.sc)best={aln:a,words:w,sc};}return best||{aln:align(T,[]),words:[],sc:0};}
function judge(T,aln,strict){

function recordWords(T,aln){T.forEach((t,i)=>{if(!t.key)return;const r=S.stats[t.n]||(S.stats[t.n]={h:0,m:0});if(aln.t[i]==='hit')r.h++;else r.m++;});save();}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const Mic={ok:!!SR,want:false,rec:null,running:false,handler:null,fails:0,ignoreUntil:0,state:'off'};
const micBtn=$('#mic');
function micUI(s){Mic.state=s;micBtn.classList.toggle('on',s==='on');micBtn.classList.toggle('bad',s==='denied');}
function startRec(){
  if(!SR||!Mic.want||Mic.running)return;
  const r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=false;r.maxAlternatives=3;
  Mic.rec=r;Mic.running=true;let got=false;
  r.onstart=()=>micUI('on');
  r.onresult=e=>{
    if(Mic.rec!==r||performance.now()<Mic.ignoreUntil||!Mic.handler)return;
    got=true;Mic.fails=0;
    const n=e.results.length,prim=[];for(let i=0;i<n;i++)prim.push(e.results[i][0].transcript);
    const last=e.results[n-1],cands=[norm(prim.join(' '))];
    for(let j=1;j<last.length;j++)cands.push(norm(prim.slice(0,n-1).concat(last[j].transcript).join(' ')));
    Mic.handler({cands,final:last.isFinal});
  };
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){Mic.want=false;micUI('denied');}};
  r.onend=()=>{
    if(Mic.rec===r){Mic.rec=null;Mic.running=false;}
    if(!Mic.want){if(Mic.state!=='denied')micUI('off');return;}
    if(!got&&++Mic.fails>=3){Mic.want=false;micUI('off');return;}
    setTimeout(startRec,100);
  };
  try{r.start();}catch(e){Mic.running=false;Mic.rec=null;micUI('off');}
}
Mic.on=()=>{if(!SR)return;micBtn.classList.remove('hide');Mic.want=true;Mic.fails=0;startRec();};
Mic.off=()=>{micBtn.classList.add('hide');Mic.want=false;Mic.handler=null;try{Mic.rec&&Mic.rec.abort();}catch(e){}micUI('off');};
Mic.reset=()=>{Mic.ignoreUntil=performance.now()+260;try{Mic.rec&&Mic.rec.abort();}catch(e){}};
micBtn.onclick=()=>{Snd.init();Snd.resume();if(Mic.want&&Mic.state==='on'){Mic.want=false;try{Mic.rec&&Mic.rec.abort();}catch(e){}micUI('off');}else Mic.on();};

/* ---------- line rendering ---------- */
const play=$('#play');
function patNodes(raw,tok){
  const out=[],w=raw;if(!tok.key){out.push(document.createTextNode(w));return out;}
  let i=0,buf='';const flush=()=>{if(buf){out.push(document.createTextNode(buf));buf='';}};
  const low=w.toLowerCase();
  while(i<w.length){
    if(low.startsWith('igh',i)){flush();out.push(el('span','q',w.substr(i,3)));i+=3;}
    else if(low.startsWith('ou',i)){flush();out.push(el('span','q',w.substr(i,2)));i+=2;}
    else if(low.startsWith('ir',i)||low.startsWith('ur',i)){flush();out.push(el('span','p',w.substr(i,2)));i+=2;}
    else{buf+=w[i];i++;}
  }
  flush();return out;
}
function mountLine(parent,text,opts={}){
  const box=el('div','line');const tokens=text.split(/\s+/).map(raw=>{const t=mkTok(raw);const sp=el('span','w');patNodes(raw,t).forEach(n=>sp.append(n));t.el=sp;box.append(sp,' ');return t;});
  parent.append(box);
  return{box,tokens,text,
    apply(aln,final){tokens.forEach((t,i)=>{const s=aln?aln.t[i]:null;t.el.className='w'+(s==='hit'?' hit':(final&&s?' '+s:''));});},
    allHit(){tokens.forEach(t=>t.el.className='w hit');}};
}
function renderHeard(box,words,aln,final){
  box.replaceChildren();const b=el('b','','heard');box.append(b);
  if(!words||!words.length){box.append(el('i','','…'));return;}
  words.forEach((w,k)=>{const s=aln?aln.h[k]:'';box.append(el('span',s==='hit'?'hit':(final?s:''),w));});

function readOne(it,left){
  return new Promise(res=>{
    play.replaceChildren();
    const top=el('div','sm',left>0?`${left} more after this`:'last one');play.append(top);
    const wrap=el('div','');wrap.style.cssText='margin:auto 0;display:flex;flex-direction:column;gap:14px';play.append(wrap);
    const line=mountLine(wrap,it.t);const hb=el('div','heard');wrap.append(hb);renderHeard(hb,null);
    const m=msgEl();wrap.append(m);
    const hear=el('button','hear hide','▶ Hear it');hear.onclick=()=>{it.assisted=true;speak(it.t);};wrap.append(hear);
    let done=false;
    const finish=clean=>{
      if(done)return;done=true;Mic.handler=null;T.force=null;Mic.reset();
      line.allHit();sfx('good');burst(10);m.textContent='';
      setTimeout(()=>res({clean}),340);
    };
    T.force=()=>finish(true);
    if(TEST)wrap.append(testBtn('pass this line',()=>finish(true)));
    if(Mic.ok){
      Mic.handler=({cands,final})=>{
        const b=bestAln(line.tokens,cands);line.apply(b.aln,final);renderHeard(hb,b.words,b.aln,final);
        if(judge(line.tokens,b.aln,S.strict)){finish(it.tries<2&&!it.assisted);return;}
        if(final){it.tries++;recordWords(line.tokens,b.aln);m.textContent=it.tries<2?'Close — fix the orange word.':'Try it once more, slowly.';if(it.tries>=2)hear.classList.remove('hide');}
      };
      Mic.on();
    }else{
      const ok=el('button','go','Teacher ✓ he read it');ok.onclick=()=>finish(true);wrap.append(ok);
    }
  });
}

async function sprint(bank,shots,n=10){
  Snd.music(false);

  const picked=[];must.forEach(w=>{const f=pool.find(s=>s.toLowerCase().includes(w)&&!picked.includes(s));if(f)picked.push(f);});

/* ---------- choose by reading aloud ---------- */
function choose(cfg){
  return new Promise(res=>{
    const need=cfg.need||1;let got=0,wrong=0,locked=false,hinted=false;
    play.replaceChildren();

    if(cfg.ask)play.append(el('div','ask',cfg.ask));
    const list=el('div','opts'+(cfg.opts.length>4?' many':''));play.append(list);
    const hb=el('div','heard');const m=msgEl();play.append(m,hb);renderHeard(hb,null);
    const O=cfg.opts.map(o=>Object.assign({state:'live'},o));
    O.forEach(o=>{
      o.el=el('div','opt');o.line=mountLine(o.el,o.t);
      let timer=null;
      const hold=()=>{o.el.onpointerdown=()=>{timer=setTimeout(()=>{timer=null;if(!locked&&o.state==='live')commit(o);},900);};
        const up=()=>{if(timer){clearTimeout(timer);timer=null;if(!locked&&o.state==='live'){m.textContent=Mic.ok?'Read it out loud to choose.':'';if(!Mic.ok)teacherConfirm(()=>commit(o));}}};
        o.el.onpointerup=up;o.el.onpointerleave=()=>{if(timer){clearTimeout(timer);timer=null;}};};
      hold();

    });
    const layout=()=>{list.replaceChildren();const live=shuffle(O.filter(o=>o.state==='live')),dead=O.filter(o=>o.state==='dead');live.concat(dead).forEach(o=>list.append(o.el));};
    layout();
    T.picks=()=>O.filter(o=>o.state==='live').map(o=>({label:o.t,go:()=>commit(o)}));
    const finish=()=>{Mic.handler=null;T.picks=null;T.force=null;Mic.reset();res({wrong,assisted:hinted});};
    async function commit(o){
      if(locked)return;locked=true;Mic.reset();renderHeard(hb,null);
      try{
        if(o.ok){
          got++;o.state='done';o.line.allHit();o.el.classList.add('right');sfx('good');burst(10);m.textContent='';
          if(cfg.good)await cfg.good(o,got);
          if(got>=need){finish();return;}
          list.removeChild(o.el);
        }else{
          wrong++;o.state='dead';o.el.classList.add('wrong');o.line.apply(null,false);sfx('bad');shake();m.textContent=o.why||'Not quite.';
          if(cfg.bad)await cfg.bad(o,wrong);
          if(wrong>=2&&!hinted&&cfg.hint){hinted=true;cam(cfg.hint);m.textContent='Look again at the picture.';}
          layout();
        }
      }catch(e){return;}
      locked=false;Mic.reset();
    }
    if(Mic.ok){
      Mic.handler=({cands,final})=>{
        if(locked)return;
        const live=O.filter(o=>o.state==='live');
        const sc=live.map(o=>{const b=bestAln(o.line.tokens,cands);return{o,b,cover:b.aln.hits/o.line.tokens.length,ok:judge(o.line.tokens,b.aln,S.strict)};});
        const top=Math.max(0,...sc.map(s=>s.cover));
        sc.forEach(s=>s.o.line.apply(top>=.3&&s.cover===top?s.b.aln:null,final&&s.cover===top));
        const lead=sc.find(s=>s.cover===top);
        renderHeard(hb,lead&&lead.b.words,lead&&lead.b.aln,final);
        const acc=sc.filter(s=>s.ok).sort((a,b)=>b.b.aln.hits-a.b.aln.hits);
        if(acc.length&&(acc.length===1||acc[0].b.aln.hits>acc[1].b.aln.hits)){recordWords(acc[0].o.line.tokens,acc[0].b.aln);commit(acc[0].o);return;}
        if(final)m.textContent=top<.3?'Read one whole line out loud.':'Read one line all the way through.';
      };
      Mic.on();
    }
  });
}

function scan(spots){
  return new Promise(res=>{
    stageH(60);
    const s=Math.max(ST.W/560,ST.H/600);
    const vw=ST.W/s,vh=ST.H/s;
    let cx=300+vw/2,cy=PANEL3[1]+PANEL3[3]/2;
    const clamp=()=>{cx=Math.max(PANEL3[0]+60,Math.min(PANEL3[0]+PANEL3[2]-60,cx));cy=Math.max(PANEL3[1]+40,Math.min(PANEL3[1]+PANEL3[3]-40,cy));};
    const draw=()=>{clamp();applyView(ST.W/2-cx*s,ST.H/2-cy*s,s,PANEL3,0);bez.style.transition='none';bez.style.left='0px';bez.style.top='0px';bez.style.width=ST.W+'px';bez.style.height=ST.H+'px';};
    panelView=true;pgs.forEach((p,i)=>p.style.opacity=i===2?1:0);curPg=2;draw();
    const ret=$('#ret'),retp=$('#retp');ret.style.display='block';
    play.replaceChildren(el('div','sm','Case notes'),el('div','hook','Drag to <em>search</em>'.replace(/<[^>]+>/g,'')));
    const sub=el('div','sm','Find what is wrong in this room');sub.style.color='#9aa7d6';play.append(sub);
    const logged=el('div','');logged.style.cssText='display:flex;flex-direction:column;gap:8px;margin-top:6px';play.append(logged);
    const jump=()=>testBtn('jump to next clue',()=>{const n=spots.find(x=>!x.done);if(n){cx=n.x;cy=n.y;draw();}});
    if(TEST)play.append(jump());
    let drag=null,reading=false,prog={},raf=0,last=performance.now(),done=0;
    const down=e=>{if(reading)return;drag={x:e.clientX,y:e.clientY};stage.setPointerCapture&&stage.setPointerCapture(e.pointerId);Snd.init();Snd.resume();};
    const move=e=>{if(!drag||reading)return;cx-=(e.clientX-drag.x)/s;cy-=(e.clientY-drag.y)/s;drag={x:e.clientX,y:e.clientY};draw();};
    const up=()=>{drag=null;};
    stage.addEventListener('pointerdown',down);stage.addEventListener('pointermove',move);stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
    const tickLoop=async now=>{
      const dt=Math.min(.1,(now-last)/1000);last=now;
      if(!reading){
        let near=null,nd=1e9;
        spots.forEach(sp=>{if(sp.done)return;const d=Math.hypot(sp.x-cx,sp.y-cy);if(d<nd){nd=d;near=sp;}});
        if(near){
          const prox=Math.max(0,1-nd/600);Snd.hum(prox);
          if(nd<near.r){prog[near.k]=(prog[near.k]||0)+dt;}else prog[near.k]=Math.max(0,(prog[near.k]||0)-dt*2);
          retp.setAttribute('stroke-dashoffset',226*(1-Math.min(1,(prog[near.k]||0)/.7)));
          ret.querySelector('circle').style.stroke=nd<near.r?'#ffd23f':'#000';
          if((prog[near.k]||0)>=.7){
            reading=true;near.done=true;Snd.humOff();retp.setAttribute('stroke-dashoffset',226);sfx('pin');flash();
            const pin=el('div','pin');pin.style.left=near.x+'px';pin.style.top=near.y+'px';world.append(pin);
            cancelAnimationFrame(raf);
            await inspect(near);
            done++;
            if(done>=spots.length){stage.removeEventListener('pointerdown',down);stage.removeEventListener('pointermove',move);stage.removeEventListener('pointerup',up);stage.removeEventListener('pointercancel',up);ret.style.display='none';panelView=null;document.querySelectorAll('.pin').forEach(p=>p.remove());res();return;}
            reading=false;last=performance.now();
            play.replaceChildren(el('div','sm','Case notes'),sub,logged);if(TEST)play.append(jump());
            raf=requestAnimationFrame(tickLoop);return;
          }
        }
      }
      raf=requestAnimationFrame(tickLoop);
    };
    async function inspect(sp){
      const lbl={tools:'On the floor',wires:'On the roof',floor:'In the middle'}[sp.k];
      const r=await readOne({t:sp.line,tries:0,assisted:false},0);
      const c=el('div','ask',sp.line);c.style.cssText+=';font:700 14px var(--bd);letter-spacing:0;text-transform:none;background:var(--paper);clip-path:none;border:2px solid #000;padding:4px 8px;transform:rotate('+(Math.random()*2-1).toFixed(1)+'deg)';logged.append(c);
    }
    raf=requestAnimationFrame(tickLoop);
  });
}

    $('#curtain').classList.add('up');sfx('whoosh');await sleep(1300);
  }
  /* order */
  await orderCards(cards);
  /* final cut */
  Snd.music(true);
  play.replaceChildren(el('div','sm','The story so far'));
  const hh=el('div','hook');hh.append(el('em','','To be continued…'));play.append(hh);
  for(const k of ['shedL','buzz','man','map','alley','shop','draw','tower']){cam(k,{dur:1500});await sleep(1800);}
  const b=await waitGo('Back to start',  'alt');title();
}
function retell(c){
  return new Promise(res=>{
    play.replaceChildren();
    const row=el('div','');row.style.cssText='display:flex;gap:12px;align-items:flex-start';
    const im=el('img','');im.src=CARD[c];im.style.cssText='width:34%;max-width:130px;border:3px solid #000;box-shadow:4px 4px 0 #000';
    const right=el('div','');right.style.cssText='display:flex;flex-direction:column;gap:8px;flex:1;min-width:0';
    right.append(el('div','ask','Tell what happened'));
    const chips=el('div','chips');const cw=el('span','',c.toUpperCase()),cwho=el('span','','WHO'),cwhat=el('span','','WHAT');chips.append(cw,cwho,cwhat);right.append(chips);
    row.append(im,right);play.append(row);
    const live=el('div','live','…');play.append(live);
    let done=false;
    const finish=()=>{if(done)return;done=true;Mic.handler=null;T.force=null;Mic.reset();sfx('card');burst(14);setTimeout(res,500);};
    T.force=finish;
    const R=RETELL[c];
    if(Mic.ok){
      Mic.handler=({cands})=>{
        const w=cands[0];const txt=w.join(' ');live.textContent=txt||'…';
        const k=w.some(x=>x===c||(c==='curly'&&x==='curley'));const who=WHO.test(txt),what=R.what.test(txt);
        cw.classList.toggle('on',k);cwho.classList.toggle('on',who);cwhat.classList.toggle('on',what);
        if(k&&who&&what&&w.length>=6)finish();
      };
      Mic.on();
    }
    const t=el('button','hear','Teacher: good retell ✓');t.onclick=finish;play.append(t);
  });
}
async function orderCards(cards){
  Mic.off();
  play.replaceChildren(el('div','ask','Put the story in order'));
  const wrap=el('div','ord');play.append(wrap);
  const m=msgEl();play.append(m);
  let next=0;const correct=CARDS.filter(c=>cards.includes(c));
  await new Promise(res=>{
    const draw=()=>{wrap.replaceChildren();shuffle(correct).forEach(c=>{const d=el('div','c');const im=el('img');im.src=CARD[c];d.append(im);const pos=correct.indexOf(c);
      if(pos<next){d.append(el('b','',String(pos+1)));d.style.opacity=.9;}
      d.onclick=()=>{if(pos<next)return;if(pos===next){next++;sfx('pin');cam(RETELL[c].shot);d.append(el('b','',String(next)));if(next>=correct.length){setTimeout(res,700);}}else{d.classList.add('no');sfx('bad');m.textContent='Think about what happened first.';setTimeout(()=>{d.classList.remove('no');},420);}};
      wrap.append(d);});};
    draw();
  });
}

/* ---------- title & chapter router ---------- */
function title(editName=false){
  $('#title')?.remove();
  RUN++;Mic.off();setStatic(0);panelView=null;$('#ret').style.display='none';document.querySelectorAll('.pin').forEach(p=>p.remove());
  stageH(56,false);cam('title',{dur:0});cap(null);$('#curtain').classList.add('up');
  const tl=el('div','');tl.id='title';tl.style.cssText='position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none;background:linear-gradient(0deg,rgba(13,18,32,.95),transparent 55%)';
  const t=el('div','ttl','The Gate 8:');t.append(el('em','','The Empty Room'));tl.append(t);stage.append(tl);
  play.replaceChildren();
  const go=el('button','go',S.ch>0&&S.ch<5?`Continue · paragraph ${Math.min(S.ch+1,4)} ▸`:'Start ▸');
  const wrap=el('div','');wrap.style.cssText='display:flex;flex-direction:column;gap:10px;margin-top:auto';
  go.onclick=()=>{Snd.init();Snd.resume();tl.remove();startChapter(S.ch>=4?0:S.ch);};
  const nameArea=el('div','student-name-area');
  wrap.append(nameArea,go);
  const startGame=go.onclick;
  function showGreeting(){
    const greeting=el('div','student-greeting','Welcome, ');
    const player=el('button','student-name-link',student.name);
    player.type='button';
    player.setAttribute('aria-label','Change player, currently '+student.name);
    player.onclick=()=>title(true);
    greeting.append(player,'!');
    nameArea.replaceChildren(greeting);
    go.textContent=S.ch>0&&S.ch<5?`Continue · paragraph ${Math.min(S.ch+1,4)} ▸`:'Start ▸';
    go.onclick=startGame;
    if(S.ch>0&&S.ch<5&&!wrap.querySelector('.alt')){
      const restart=el('button','go alt','From the start');
      restart.style.fontSize='22px';
      restart.onclick=()=>{Snd.init();Snd.resume();tl.remove();S.ch=0;startChapter(0);};
      wrap.append(restart);
    }
  }
  if(student&&!editName)showGreeting();
  else{
    const form=el('form','student-form');
    const input=el('input','student-input');
    input.name='student-name';input.placeholder='name';input.maxLength=32;
    input.required=true;input.autocomplete='off';input.autocapitalize='words';
    input.setAttribute('aria-label','Student name');
    input.enterKeyHint='done';
    form.append(input);
    nameArea.append(form);
    function confirmName(){
      const name=input.value.trim().replace(/\s+/g,' ');
      if(!name)return false;
      selectStudent(name);showGreeting();return true;
    }
    form.onsubmit=event=>{event.preventDefault();if(confirmName())go.focus();};
    input.onblur=()=>{confirmName();};
    go.onclick=()=>{if(confirmName())startGame();else input.focus();};
    if(editName)requestAnimationFrame(()=>input.focus());
  }
  play.append(el('div','sm','Read · listen · decide'),wrap);
  Snd.music(false);
  if(!Mic.ok){const w=el('div','sm','No speech recognition here — teacher mode');w.style.color='#ffb061';play.insertBefore(w,wrap);}
  micBtn.classList.add('hide');
}
function startChapter(i){
  const t=$('#title');if(t)t.remove();
  RUN++;Mic.off();setStatic(0);panelView=null;$('#ret').style.display='none';document.querySelectorAll('.pin').forEach(p=>p.remove());Snd.humOff();
  S.ch=i;save();
  const flows=[ch1,ch2,ch3,ch4,finale];
  flows[i]().then(()=>{if(i<3){startChapter(i+1);}else if(i===3){S.ch=4;save();startChapter(4);}}).catch(e=>{if(e!=='cancel')console.error(e);});
}
addEventListener('resize',()=>{if(!panelView){measure();cam(lastShot,{dur:0,keepPage:true});}});
function skipNow(){
  const vis=b=>b&&b.offsetParent;
  const go=[...document.querySelectorAll('#play .go')].find(vis);
  if(go){go.click();return;}
  const pass=[...document.querySelectorAll('#play .hear')].find(b=>/pass this line/.test(b.textContent));
  if(pass){pass.click();return;}
  const opt=document.querySelector('#play .opt:not(.wrong)');
  if(opt){opt.click();return;}
  const jump=[...document.querySelectorAll('#play .hear')].find(b=>/jump to next clue/.test(b.textContent));
  if(jump){jump.click();return;}
  if(T.force){T.force();return;}
  if(T.picks){const p=T.picks()[0];if(p)p.go();}
}
if(TEST){const sk=document.createElement('button');sk.id='skip';sk.textContent='SKIP ›';sk.setAttribute('aria-label','Test skip');
  sk.style.cssText='width:auto;padding:0 10px;font:400 18px var(--hd);letter-spacing:.05em;background:var(--orange);color:#000';
  sk.onclick=skipNow;$('#hud').prepend(sk);}
renderTray();title();
</script>

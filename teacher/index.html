<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Inspect saved student worlds across Qin, Lemon and Seven."><title>Student worlds · ExamGames</title><link rel="stylesheet" href="styles-v2.css"></head><body>
<header class="app-bar"><a class="brand" href="#"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M3 25l13-9 16 8-13 9z" fill="#c1d4c4"/><path d="M3 23l13-9 16 8-13 9z" fill="#43745b"/><path d="M13 20V11l5-4 6 4v11" fill="#ecd9b0"/><path d="M10 12l8-7 9 7" fill="none" stroke="#b56e4c" stroke-width="3"/></svg><span>ExamGames <b>Teacher</b></span></a><nav aria-label="Dashboard views"><button id="nav-class" class="nav-item active">Students</button><button id="nav-hidden" class="nav-item">Hidden <span id="hidden-count">0</span></button></nav><div class="header-right"><span class="private-pill">Teacher view</span><button class="button" id="manage-accounts">Manage accounts</button></div></header>
<main><div class="page"><header class="page-heading"><div><h1>Student worlds</h1><p id="breadcrumb">Qin, Lemon and Seven.</p></div><div class="top-actions"><button class="button" id="export">Export view ↓</button><button class="button primary" id="refresh">Refresh saves</button></div></header>
<section class="islands" id="island-tabs" aria-label="Choose an island"></section>
<div class="class-strip"><section class="summary" aria-label="Class summary"><div><strong id="stat-students">—</strong><span>accounts</span><small id="stat-hidden">No accounts hidden</small></div><div><strong id="stat-worlds">—</strong><span>worlds</span></div><div><strong id="stat-mastered">—</strong><span>items mastered</span></div><div><strong id="stat-review">—</strong><span>review items</span></div></section><div id="connection" class="connection" role="status"><i class="live-dot"></i><span id="connection-text">Connecting…</span><span id="updated-time"></span></div></div>
<section class="students-section"><div class="list-heading"><div><h2 id="section-heading">All student worlds</h2><p id="results-count">Loading accounts…</p></div><button class="text-button" id="clear-island" hidden>Show all worlds</button></div><div class="filters"><label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M12 12l5 5"/></svg><input id="search" placeholder="Search name or save code" aria-label="Search students"></label><label class="review-filter"><input id="review-only" type="checkbox"> Needs review</label><select id="sort" aria-label="Sort students"><option value="recent">Recently saved</option><option value="name">Name A–Z</option><option value="review">Most review items</option></select><div class="view-switch" role="group" aria-label="Display style"><button id="list-view" aria-pressed="true" aria-label="Table view">List</button><button id="grid-view" aria-pressed="false" aria-label="Card view">Cards</button></div></div><div id="records" class="record-grid" aria-live="polite"></div></section>
<footer><span id="roster-status">All accounts are included. Hide testing accounts manually.</span><button class="text-button" id="import-button">Import account list or saves</button><input type="file" id="import-file" accept="application/json,.json" hidden></footer></div></main>
<div id="modal-root"></div><div id="toast" class="toast" role="status" hidden></div><script type="module" src="app.js"></script></body></html>
